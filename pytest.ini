[pytest]
# --- Where the tests are ---------------------------------------------------------
# Shared fixtures and hooks: conftest.py in the project root
testpaths = tests

# --- Markers ---------------------------------------------------------------------
markers =
    rstudio_local: drives a browser against the Posit Workbench instance in .env

# --- Default options -------------------------------------------------------------
# -ra: summary line for every test that did not pass
# --strict-markers: a typo'd marker is an error, not a silently new marker
addopts = -ra --strict-markers
