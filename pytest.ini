[pytest]
# --- Where the tests are ---------------------------------------------------------
# Shared fixtures and hooks: conftest.py in the project root
testpaths = tests

# --- Markers ---------------------------------------------------------------------
markers =
    rstudio_local: drives a browser against the Posit Workbench instance in .env
    snapshot: project snapshot timing (up to ~2.5 h); deselected by default, run with -m snapshot
    # pytest-timeout registers this itself; listed here too so a machine without
    # it still collects the snapshot test (the timeout is then not enforced)
    timeout(seconds): fail the test after this many seconds (needs pytest-timeout)

# --- Default options -------------------------------------------------------------
# -ra: summary line for every test that did not pass
# --strict-markers: a typo'd marker is an error, not a silently new marker
# -m "not snapshot": the long snapshot test only runs when asked for; a -m on
#   the command line (e.g. -m snapshot) replaces this one
addopts = -ra --strict-markers -m "not snapshot"
